name: UnrealLibretro

# Builds the plugin on GitHub-hosted runners, in parallel across engine
# versions. Runners don't have Unreal Engine and don't have the disk for a full
# install, so each job downloads a minimal AES-256-encrypted engine snapshot
# from a `ue-cache/<major>.<minor>` (Windows) or `ue-cache-mac/<major>.<minor>`
# (Mac) prerelease of this repository and decrypts it with the
# ENGINE_CACHE_KEY repository secret. Those snapshots are produced by the
# engine-cache workflow (built from Epic's source) or by
# Tools/CI/prune_engine.py against a local engine install -- see
# Tools/CI/README.md for setup and Epic EULA considerations.
#
# The Mac side currently tracks a single canary version rather than the full
# matrix: it exists to catch Darwin-specific regressions early, not to publish
# every engine version for Mac.

on:
  workflow_dispatch:
  push:
    branches: [ master, github-workflow-test ]
    tags:
      - 'v*.*.*'

jobs:
  # The matrix is generated from whichever ue-cache/* releases actually exist,
  # so adding a new engine version to CI is just uploading a new engine cache.
  discover-engines:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.engines.outputs.matrix }}
      found: ${{ steps.engines.outputs.found }}
    steps:
      - name: List available engine caches
        id: engines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          matrix=$(gh api "repos/${{ github.repository }}/releases" --paginate --jq '.[].tag_name' \
            | { grep -E '^ue-cache/[0-9]+\.[0-9]+$' || true; } \
            | sed 's|^ue-cache/||' \
            | sort -t. -k1,1n -k2,2n \
            | jq -Rc 'split(".") | {major: (.[0] | tonumber), minor: (.[1] | tonumber)}' \
            | jq -sc '.')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$matrix" != "[]" ] && [ -n "$matrix" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Engine caches available: $matrix"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ue-cache/* releases found. Upload engine caches with Tools/CI/prune_engine.py to enable plugin builds."
          fi

  # Mirrors discover-engines but for the Mac canary cache(s). Kept as a
  # separate job/matrix since Mac currently tracks one version, not the full
  # 4.24-5.8 range, and runs on a different (macos) runner image.
  discover-mac-engines:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.engines.outputs.matrix }}
      found: ${{ steps.engines.outputs.found }}
    steps:
      - name: List available Mac engine caches
        id: engines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          matrix=$(gh api "repos/${{ github.repository }}/releases" --paginate --jq '.[].tag_name' \
            | { grep -E '^ue-cache-mac/[0-9]+\.[0-9]+$' || true; } \
            | sed 's|^ue-cache-mac/||' \
            | sort -t. -k1,1n -k2,2n \
            | jq -Rc 'split(".") | {major: (.[0] | tonumber), minor: (.[1] | tonumber)}' \
            | jq -sc '.')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$matrix" != "[]" ] && [ -n "$matrix" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Mac engine caches available: $matrix"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ue-cache-mac/* releases found yet; skipping Mac build."
          fi

  create-release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # Only release when a tag is pushed
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            || echo "Release already exists"

  build:
    needs: [discover-engines, create-release]
    # create-release is skipped on non-tag pushes; build should still run then
    if: >-
      always() && needs.discover-engines.outputs.found == 'true' &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: windows-2025
    timeout-minutes: 300
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.discover-engines.outputs.matrix) }}
    env:
      ENGINE_CACHE_TAG: ue-cache/${{ matrix.version.major }}.${{ matrix.version.minor }}
      # D: has ~147GB free on hosted Windows runners; C: only has ~40GB
      ENGINE_ROOT: D:\UE

    steps:
      - uses: actions/checkout@v4

      - name: Check ENGINE_CACHE_KEY secret is configured
        env:
          ENGINE_CACHE_KEY: ${{ secrets.ENGINE_CACHE_KEY }}
        run: |
          if (-not $env:ENGINE_CACHE_KEY) {
            Write-Host "::error::The ENGINE_CACHE_KEY repository secret is not set. It must match the key used by Tools/CI/prune_engine.py when the engine caches were created."
            exit 1
          }

      - name: Report disk space
        run: Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

      - name: Download engine cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$env:ENGINE_CACHE_TAG" --repo "${{ github.repository }}" --dir D:\ue-cache
          Get-ChildItem D:\ue-cache | Format-Table Name, Length -AutoSize

      - name: Verify volume checksums
        run: |
          $manifest = Get-Content D:\ue-cache\manifest.json | ConvertFrom-Json
          foreach ($volume in $manifest.volumes) {
            $actual = (Get-FileHash -Algorithm SHA256 "D:\ue-cache\$($volume.name)").Hash.ToLower()
            if ($actual -ne $volume.sha256) {
              Write-Host "::error::Checksum mismatch for $($volume.name)"
              exit 1
            }
          }
          Write-Host "All $($manifest.volumes.Count) volume(s) verified for engine $($manifest.engine_version)"

      - name: Extract engine
        env:
          ENGINE_CACHE_KEY: ${{ secrets.ENGINE_CACHE_KEY }}
        run: |
          $firstVolume = (Get-ChildItem D:\ue-cache\*.7z.001).FullName
          7z x -aoa "-p$env:ENGINE_CACHE_KEY" "-o$env:ENGINE_ROOT" $firstVolume
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item D:\ue-cache -Recurse -Force # Reclaim the disk before building

      # UE4 needs the VS2019 (v142) toolchain which hosted images no longer
      # carry. Best effort; drop 4.x engine caches if this ever breaks
      - name: Install VS2019 Build Tools (UE4 only)
        if: matrix.version.major == 4
        run: |
          choco install visualstudio2019buildtools --no-progress -y --package-parameters `
            "--add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --add Microsoft.VisualStudio.Component.Windows10SDK.19041 --includeRecommended --quiet --norestart"
          if ($LASTEXITCODE -in 0, 3010) { exit 0 } else { exit $LASTEXITCODE } # 3010 = success, reboot required

      # Same era-appropriate SDK/toolchain pins as engine-cache.yml: the
      # engine-source patches travel inside the cache archives, but
      # BuildConfiguration.xml is per-runner state, so the consumer must
      # recreate it or UBT picks the newest SDK, whose headers old engines
      # can't compile under warnings-as-errors (C4668 NTDDI_WIN10_GE)
      - name: Install Windows SDK 19041 (UE 5.0 only)
        if: matrix.version.major == 5 && matrix.version.minor == 0
        run: choco install windows-sdk-10-version-2004-all --no-progress -y

      - name: Pin era-appropriate SDK and toolchain via BuildConfiguration.xml
        if: matrix.version.major == 4 || (matrix.version.major == 5 && matrix.version.minor == 0)
        run: |
          $pins = @("      <WindowsSdkVersion>10.0.19041.0</WindowsSdkVersion>")
          # 4.25's UBT can't enumerate the BuildTools SKU, so a compiler pin it
          # can't resolve is fatal there; it builds with the modern toolchain
          # (the cached engine sources carry the warning patches this needs)
          if (("${{ matrix.version.major }}" -eq "4") -and ("${{ matrix.version.minor }}" -ne "25")) {
            $msvcRoot = "C:\Program Files (x86)\Microsoft Visual Studio\2019\BuildTools\VC\Tools\MSVC"
            if (Test-Path $msvcRoot) {
              $compiler = (Get-ChildItem $msvcRoot -Directory | Sort-Object Name | Select-Object -Last 1).Name
              $pins += "      <CompilerVersion>$compiler</CompilerVersion>"
            }
          }
          $bcDir = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'Unreal Engine\UnrealBuildTool'
          New-Item -ItemType Directory -Force $bcDir | Out-Null
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <Configuration xmlns="https://www.unrealengine.com/BuildConfiguration">
            <WindowsPlatform>
          $($pins -join "`n")
            </WindowsPlatform>
          </Configuration>
          "@ | Out-File -Encoding utf8 (Join-Path $bcDir 'BuildConfiguration.xml')
          Get-Content (Join-Path $bcDir 'BuildConfiguration.xml')

      - name: Run Setup Script
        run: ./setup.cmd

      - name: Package for Unreal Engine
        run: |
          $compiler = if (${{ matrix.version.major }} -eq 4) { @("--compiler", "VS2019") } else { @() }
          python package.py "$env:ENGINE_ROOT" "$env:RUNNER_TEMP" @compiler
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Build-Artifact
        if: startsWith(github.ref, 'refs/heads/') # Upload artifacts when commits (not tags) are pushed
        uses: actions/upload-artifact@v4
        with:
          name: UnrealLibretro-${{ matrix.version.major }}.${{ matrix.version.minor }}
          path: ${{ runner.temp }}/UnrealLibretro-${{ matrix.version.major }}.${{ matrix.version.minor }}
          if-no-files-found: error

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/') # Only release when a tag is pushed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$env:GITHUB_REF_NAME" --repo "${{ github.repository }}" --clobber `
            "$env:RUNNER_TEMP/UnrealLibretro-${{ matrix.version.major }}.${{ matrix.version.minor }}.zip"

  # Canary Mac build: proves the plugin still compiles on Darwin. Package
  # names get a "-Mac" suffix (see package.py) so they never collide with the
  # unsuffixed Win64 assets of the same engine version in one release.
  build-mac:
    needs: [discover-mac-engines, create-release]
    if: >-
      always() && needs.discover-mac-engines.outputs.found == 'true' &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: macos-latest
    timeout-minutes: 300
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.discover-mac-engines.outputs.matrix) }}
    env:
      ENGINE_CACHE_TAG: ue-cache-mac/${{ matrix.version.major }}.${{ matrix.version.minor }}
      ENGINE_ROOT: ${{ github.workspace }}/../UE-mac

    steps:
      - uses: actions/checkout@v4

      - name: Check ENGINE_CACHE_KEY secret is configured
        env:
          ENGINE_CACHE_KEY: ${{ secrets.ENGINE_CACHE_KEY }}
        run: |
          if [ -z "$ENGINE_CACHE_KEY" ]; then
            echo "::error::The ENGINE_CACHE_KEY repository secret is not set. It must match the key used when the engine-cache workflow built this cache."
            exit 1
          fi

      - name: Install 7-Zip
        run: brew install p7zip

      - name: Report disk space
        run: df -h

      - name: Download engine cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$ENGINE_CACHE_TAG" --repo "${{ github.repository }}" --dir "$HOME/ue-cache"
          ls -la "$HOME/ue-cache"

      - name: Verify volume checksums
        run: |
          python3 - <<'EOF'
          import json, hashlib, os, sys
          manifest = json.load(open(os.path.expanduser("~/ue-cache/manifest.json")))
          for volume in manifest["volumes"]:
              path = os.path.expanduser(f"~/ue-cache/{volume['name']}")
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              if h.hexdigest() != volume["sha256"]:
                  print(f"::error::Checksum mismatch for {volume['name']}")
                  sys.exit(1)
          print(f"All {len(manifest['volumes'])} volume(s) verified for engine {manifest['engine_version']}")
          EOF

      - name: Extract engine
        env:
          ENGINE_CACHE_KEY: ${{ secrets.ENGINE_CACHE_KEY }}
        run: |
          firstVolume=$(ls "$HOME"/ue-cache/*.7z.001)
          7z x -aoa -p"$ENGINE_CACHE_KEY" -o"$ENGINE_ROOT" "$firstVolume"
          rm -rf "$HOME/ue-cache" # Reclaim disk before building

      - name: Prepare user content folders
        run: mkdir -p MyROMs MyCores

      - name: Package for Unreal Engine
        run: python3 package.py "$ENGINE_ROOT" "$RUNNER_TEMP" --target-platforms Mac

      - name: Upload Build-Artifact
        if: startsWith(github.ref, 'refs/heads/') # Upload artifacts when commits (not tags) are pushed
        uses: actions/upload-artifact@v4
        with:
          name: UnrealLibretro-Mac-${{ matrix.version.major }}.${{ matrix.version.minor }}
          path: ${{ runner.temp }}/UnrealLibretro-${{ matrix.version.major }}.${{ matrix.version.minor }}-Mac
          if-no-files-found: error

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/') # Only release when a tag is pushed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "${{ github.repository }}" --clobber \
            "$RUNNER_TEMP/UnrealLibretro-${{ matrix.version.major }}.${{ matrix.version.minor }}-Mac.zip"
