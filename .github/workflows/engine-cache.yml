name: engine-cache

# Builds encrypted minimal Unreal Engine caches FROM EPIC'S SOURCE REPO on free
# GitHub-hosted runners, for the UnrealLibretro workflow to build against. No
# self-hosted runner and no local engine install required.
#
# Strategy: a prepare job resolves the newest X.Y.Z-release tag for every
# version in the matrix straight from EpicGames/UnrealEngine and drops versions
# that already have a published ue-cache/<version> release. Each remaining
# version then builds in parallel: shallow-clone at the tag, slim the tree down
# to what a plugin compile needs, and run the normal plugin build (package.py ->
# RunUAT BuildPlugin). UnrealBuildTool compiles exactly the engine-module
# closure the plugin depends on -- a surprisingly small subset of the engine.
# If a build can't finish inside the wall-clock budget it checkpoints the whole
# working tree (sources + intermediates) to an encrypted ue-cache-wip/*
# prerelease and re-triggers itself to resume incrementally. When the plugin
# build succeeds, the tree is published as the ue-cache/<major>.<minor> release
# that .github/workflows/UnrealLibretro.yml discovers and consumes.
#
# A separate best-effort job builds UE 5.8 on an Apple Silicon runner into a
# ue-cache-mac/5.8 release, and uploads the packaged Mac plugin as an artifact.
#
# Required repository secrets:
#   UE_SOURCE_TOKEN  Classic PAT with `repo` scope from a GitHub account linked
#                    to Epic Games (grants read access to EpicGames/UnrealEngine;
#                    also used to re-trigger this workflow, which the built-in
#                    GITHUB_TOKEN is not allowed to do)
#   ENGINE_CACHE_KEY Symmetric encryption password for the published archives

on:
  workflow_dispatch:
    inputs:
      ue_ref:
        description: "Specific EpicGames/UnrealEngine tag or branch to (re)build on Windows (e.g. 5.3.2-release). Leave empty to build every unpublished matrix version"
        required: false
        default: ""
      mac_ref:
        description: "Specific tag or branch to (re)build on macOS arm64. Leave empty for automatic"
        required: false
        default: ""
      attempt:
        description: "Internal: resume attempt counter"
        required: false
        default: "1"
      max_attempts:
        description: "Give up after this many checkpoint/resume cycles"
        required: false
        default: "6"
  # Temporary bring-up trigger: workflow_dispatch only works once this file is
  # on the default branch, so during development pushes to the working branch
  # run the workflow in automatic mode. Remove before merging to master
  push:
    branches: [ claude/github-issues-triage-lu1k09 ]

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      found: ${{ steps.resolve.outputs.found }}
      mac_ref: ${{ steps.resolve.outputs.mac_ref }}
    steps:
      - name: Resolve engine versions to build
        id: resolve
        env:
          UE_SOURCE_TOKEN: ${{ secrets.UE_SOURCE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ue_ref }}
          INPUT_MAC_REF: ${{ inputs.mac_ref }}
        run: |
          set -e
          if [ -z "$UE_SOURCE_TOKEN" ]; then
            echo "::error::Missing UE_SOURCE_TOKEN secret (classic PAT with repo scope from an Epic-linked GitHub account)"
            exit 1
          fi

          tags=$(git ls-remote --tags "https://x-access-token:${UE_SOURCE_TOKEN}@github.com/EpicGames/UnrealEngine.git" 'refs/tags/*-release' \
            | awk '{print $2}' | sed 's|^refs/tags/||' | grep -v '\^{}' || true)
          published=$(gh api "repos/${{ github.repository }}/releases" --paginate --jq '.[].tag_name' | grep '^ue-cache' || true)

          resolve_tag() { # $1 = major.minor -> newest matching X.Y.Z-release tag
            echo "$tags" | grep -E "^${1//./\\.}\.[0-9]+-release$" | sort -t. -k3,3n | tail -1
          }

          entries=()
          mac_ref=""
          if [ -n "$INPUT_REF" ] || [ -n "$INPUT_MAC_REF" ]; then
            # Selective mode: build exactly what was asked for, even if published
            if [ -n "$INPUT_REF" ]; then
              entries+=("{\"version\":\"$INPUT_REF\",\"major\":${INPUT_REF%%.*},\"ref\":\"$INPUT_REF\"}")
            fi
            mac_ref="$INPUT_MAC_REF"
          else
            # Automatic mode: every matrix version without a published cache
            for v in 4.24 4.25 4.26 4.27 5.0 5.1 5.2 5.3 5.4 5.5 5.6 5.7 5.8; do
              if echo "$published" | grep -qx "ue-cache/$v"; then
                echo "ue-cache/$v already published, skipping"
                continue
              fi
              ref=$(resolve_tag "$v")
              if [ -z "$ref" ]; then
                echo "::warning::No X.Y.Z-release tag found for UE $v, skipping"
                continue
              fi
              entries+=("{\"version\":\"$v\",\"major\":${v%%.*},\"ref\":\"$ref\"}")
            done
            if ! echo "$published" | grep -qx "ue-cache-mac/5.8"; then
              mac_ref=$(resolve_tag "5.8")
            fi
          fi

          if [ ${#entries[@]} -eq 0 ]; then
            matrix="[]"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            matrix=$(printf '%s\n' "${entries[@]}" | jq -sc '.')
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "mac_ref=$mac_ref" >> "$GITHUB_OUTPUT"
          echo "Windows matrix: $matrix"
          echo "Mac ref: ${mac_ref:-none}"

  build-engine:
    needs: prepare
    if: needs.prepare.outputs.found == 'true'
    runs-on: windows-2025
    timeout-minutes: 350
    permissions:
      contents: write
    # One build per engine ref at a time, across all runs of this workflow
    concurrency:
      group: engine-cache-${{ matrix.ref }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      # D: has ~147GB free on windows-2025 runners; C: only has ~40GB
      UE_SRC: D:\UE-src
      UE_REF: ${{ matrix.ref }}
      ATTEMPT: ${{ inputs.attempt || '1' }}
      MAX_ATTEMPTS: ${{ inputs.max_attempts || '6' }}
      # Stop compiling this many minutes after the job started, leaving time to
      # checkpoint ~30GB of encrypted volumes and upload them
      BUILD_DEADLINE_MINUTES: "280"
      # MSBuild reads env vars as global properties. Epic pins NuGet packages
      # that accrue vulnerability advisories after the engine tag ships, and
      # 5.6-era script projects promote those audit warnings to errors, which
      # kills AutomationTool before it can even open a log file
      NuGetAudit: "false"
      # 5.8's UAT compiles script projects into uatobj/ while UBT's own build
      # uses obj/; whichever flavor runs second globs the other's generated
      # protobuf sources as its own (duplicate LogRpc definitions, see UE-5.8
      # forum reports). The .NET SDK seeds its glob excludes from this var
      DefaultItemExcludes: "obj/**;bin/**;uatobj/**"

    steps:
      - uses: actions/checkout@v4

      # Every push to the bring-up branch (and every re-dispatch) re-triggers
      # this workflow with the full matrix, so a version already being built by
      # an older run's concurrency-locked job gets queued right behind it (see
      # the "Waiting: this job is waiting on build-engine (...)" message in the
      # Actions UI). Once this job is finally released from that queue the
      # version may have finished and published while it waited, so check
      # before doing 4+ hours of pointless work
      - name: Skip if this version was already published while queued
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "ue-cache/${{ matrix.version }}"
          # gh exits nonzero when the release doesn't exist (the common case);
          # the runner's pwsh wrapper turns a lingering $LASTEXITCODE into a
          # step failure, so treat any gh failure as "not published" and exit 0
          $alreadyComplete = gh release view $tag --repo "${{ github.repository }}" --json assets --jq '[.assets[].name] | contains(["manifest.json"])' 2>$null
          if ($LASTEXITCODE -ne 0) { $alreadyComplete = "false" }
          if ("$alreadyComplete" -eq "true") {
            Write-Host "$tag was already published (likely by a run that finished while this job was queued behind the concurrency lock). Skipping."
            "proceed=false" | Out-File -Append $env:GITHUB_OUTPUT
          } else {
            "proceed=true" | Out-File -Append $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Check required secrets
        if: steps.gate.outputs.proceed == 'true'
        env:
          UE_SOURCE_TOKEN: ${{ secrets.UE_SOURCE_TOKEN }}
          ENGINE_CACHE_KEY: ${{ secrets.ENGINE_CACHE_KEY }}
        run: |
          if (-not $env:UE_SOURCE_TOKEN) { Write-Host "::error::Missing UE_SOURCE_TOKEN secret"; exit 1 }
          if (-not $env:ENGINE_CACHE_KEY) { Write-Host "::error::Missing ENGINE_CACHE_KEY secret"; exit 1 }
          "JOB_START=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" | Out-File -Append $env:GITHUB_ENV
          "WIP_TAG=ue-cache-wip/$($env:UE_REF -replace '[/\\]','-')" | Out-File -Append $env:GITHUB_ENV

      - name: Reclaim disk space
        if: steps.gate.outputs.proceed == 'true'
        run: |
          foreach ($dir in @("C:\Android", "$env:ANDROID_HOME", "C:\Program Files\PostgreSQL",
                             "C:\Program Files\MySQL", "C:\Strawberry", "C:\Julia", "C:\Miniconda",
                             "C:\Program Files\MongoDB", "C:\selenium")) {
            if ($dir -and (Test-Path $dir)) { Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue }
          }
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

      - name: Restore checkpoint if one exists
        if: steps.gate.outputs.proceed == 'true'
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_CACHE_KEY: ${{ secrets.ENGINE_CACHE_KEY }}
        run: |
          gh release download $env:WIP_TAG --repo "${{ github.repository }}" --dir D:\ue-wip 2>$null
          if ($LASTEXITCODE -eq 0) {
            # Push-triggered resumes carry no inputs, so the attempt counter
            # lives in the checkpoint release notes to keep the runaway guard working
            $body = gh release view $env:WIP_TAG --repo "${{ github.repository }}" --json body --jq .body
            if ("$body" -match 'next_attempt=(\d+)') {
              $effective = [Math]::Max([int]$env:ATTEMPT, [int]$Matches[1])
              "ATTEMPT=$effective" | Out-File -Append $env:GITHUB_ENV
              $env:ATTEMPT = "$effective"
            }
            Write-Host "Resuming from checkpoint $env:WIP_TAG (attempt $env:ATTEMPT)"
            $firstVolume = (Get-ChildItem D:\ue-wip\*.7z.001).FullName
            7z x -aoa "-p$env:ENGINE_CACHE_KEY" "-o$env:UE_SRC" $firstVolume
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Remove-Item D:\ue-wip -Recurse -Force
            # Early checkpoints were made from trees whose IOS/TVOS automation
            # projects had been deleted, which newer UAT versions hard-fail on.
            # Those trees can't be repaired incrementally, discard them
            if (-not (Test-Path "$env:UE_SRC\Engine\Source\Programs\AutomationTool\IOS")) {
              Write-Host "Checkpoint predates the IOS/TVOS automation fix, discarding it and starting fresh"
              Remove-Item $env:UE_SRC -Recurse -Force
              gh release delete $env:WIP_TAG --repo "${{ github.repository }}" --cleanup-tag --yes 2>$null
              "resumed=false" | Out-File -Append $env:GITHUB_OUTPUT
            } else {
              # C# obj/bin intermediates don't survive being resumed under a
              # different dotnet SDK: protobuf codegen appends duplicate members
              # into the generated sources already in obj (seen on 5.8's
              # EpicGames.Horde). They rebuild in seconds, so always drop them
              Get-ChildItem "$env:UE_SRC\Engine\Source\Programs" -Recurse -Directory -Include obj, bin, uatobj -ErrorAction SilentlyContinue |
                Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
              "resumed=true" | Out-File -Append $env:GITHUB_OUTPUT
            }
          } else {
            Write-Host "No checkpoint at $env:WIP_TAG, starting fresh"
            "resumed=false" | Out-File -Append $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Clone Unreal Engine source
        if: steps.gate.outputs.proceed == 'true' && steps.restore.outputs.resumed == 'false'
        env:
          UE_SOURCE_TOKEN: ${{ secrets.UE_SOURCE_TOKEN }}
          GH_TOKEN: ${{ secrets.UE_SOURCE_TOKEN }}
        run: |
          git clone --depth 1 --branch $env:UE_REF `
            "https://x-access-token:$($env:UE_SOURCE_TOKEN)@github.com/EpicGames/UnrealEngine.git" $env:UE_SRC
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Slim before GitDependencies downloads on top: git metadata and
          # sample/template/doc trees play no part in compiling a plugin
          foreach ($dir in @(".git", "Samples", "Templates", "FeaturePacks", "Engine\Documentation", "Engine\Extras")) {
            $path = Join-Path $env:UE_SRC $dir
            if (Test-Path $path) { Remove-Item $path -Recurse -Force }
          }
          # Older tags ship Commit.gitdeps.xml files that reference retired CDN
          # packs (Epic's 2023 dependency-security incident); Epic attached
          # corrected files to the tags' GitHub releases. Best effort: not
          # every tag has or needs one
          gh release download $env:UE_REF --repo EpicGames/UnrealEngine --pattern "Commit.gitdeps.xml" `
            --dir "$env:UE_SRC\Engine\Build" --clobber
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Applied updated Commit.gitdeps.xml from the $env:UE_REF release"
          } else {
            Write-Host "No updated Commit.gitdeps.xml published for $env:UE_REF"
          }
          exit 0

      - name: Download engine dependencies (GitDependencies)
        if: steps.gate.outputs.proceed == 'true' && steps.restore.outputs.resumed == 'false'
        working-directory: ${{ env.UE_SRC }}
        run: |
          # Call GitDependencies.exe directly rather than Setup.bat: Setup.bat
          # ends with a `pause` whenever cmd was invoked with /c (its heuristic
          # for being double-clicked) which hangs CI forever, and the
          # prerequisites installer + engine registration it also runs aren't
          # needed just to compile. Platform payloads we never build are excluded
          $gitDeps = @(
            "Engine\Binaries\DotNET\GitDependencies\win-x64\GitDependencies.exe",
            "Engine\Binaries\DotNET\GitDependencies.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $gitDeps) { Write-Host "::error::GitDependencies.exe not found in the engine tree"; exit 1 }
          # IOS/TVOS payloads stay INCLUDED: RunUAT compiles their automation
          # projects, which need resource files from the dependency stream
          & ".\$gitDeps" --exclude=Android --exclude=Linux --exclude=Linux32 --exclude=LinuxArm64 --exclude=Mac --exclude=HoloLens --exclude=HTML5 --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Editor content isn't read when compiling/linking a plugin and is one
          # of the largest payloads GitDependencies brings in
          foreach ($dir in @("Engine\Content", "Engine\Documentation", "Engine\Extras", "Samples", "Templates", "FeaturePacks")) {
            if (Test-Path $dir) { Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue }
          }
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

      # UE4's UnrealBuildTool needs the VS2019 (v142) era toolchain and .NET
      # Framework tooling that hosted images no longer carry. Best effort
      - name: Install VS2019 Build Tools (UE4 only)
        if: steps.gate.outputs.proceed == 'true' && matrix.major == 4
        run: |
          choco install visualstudio2019buildtools --no-progress -y --package-parameters `
            "--add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --add Microsoft.Component.MSBuild --add Microsoft.Net.Component.4.6.2.TargetingPack --add Microsoft.VisualStudio.Component.Windows10SDK.19041 --includeRecommended --quiet --norestart"
          if ($LASTEXITCODE -in 0, 3010) { exit 0 } else { exit $LASTEXITCODE } # 3010 = success, reboot required

      - name: Run Setup Script
        if: steps.gate.outputs.proceed == 'true'
        run: ./setup.cmd

      # The MSVC toolset UnrealBuildTool selects on this runner image (14.29)
      # flags a constant-arithmetic overflow in stock RenderCore source and the
      # build promotes it to an error; silence that one warning in the one file.
      # Runs on resumed attempts too, but the marker check keeps it idempotent
      # so file timestamps stay stable and UBT's incremental build isn't spoiled
      - name: Patch known engine-source warnings
        if: steps.gate.outputs.proceed == 'true'
        run: |
          # C4756 (overflow in constant arithmetic) fires in stock RenderCore
          # source on the MSVC toolsets these runner images provide. Which file
          # trips it moved between engine versions
          foreach ($name in @("RenderGraphPrivate.cpp", "RenderGraphBuilder.cpp")) {
            $file = Join-Path $env:UE_SRC "Engine\Source\Runtime\RenderCore\Private\$name"
            if ((Test-Path $file) -and -not (Select-String -Path $file -Pattern "4756" -Quiet)) {
              $content = Get-Content $file -Raw
              Set-Content $file -NoNewline -Value ("#ifdef _MSC_VER`r`n#pragma warning(disable: 4756) // overflow in constant arithmetic; fires in stock engine code on this MSVC toolset`r`n#endif`r`n" + $content)
              Write-Host "Patched $file"
            }
          }

          # 5.4-era Core uses clang's __has_feature in a plain #if, which the
          # newer MSVC preprocessor rejects under warnings-as-errors (C4067 /
          # C4668). Give MSVC a no-op fallback at the top of the header
          $file = Join-Path $env:UE_SRC "Engine\Source\Runtime\Core\Public\Experimental\ConcurrentLinearAllocator.h"
          if ((Test-Path $file) -and -not (Select-String -Path $file -Pattern "__has_feature\(x\) 0" -Quiet)) {
            $content = Get-Content $file -Raw
            Set-Content $file -NoNewline -Value ("#if defined(_MSC_VER) && !defined(__clang__) && !defined(__has_feature)`r`n#define __has_feature(x) 0 // MSVC has no __has_feature; stock engine code assumes clang here`r`n#endif`r`n" + $content)
            Write-Host "Patched $file"
          }

      # PDBs multiply intermediate size several times over and slow the link;
      # nothing debugs these binaries so build without debug info
      # Old engines can't compile the newest Windows SDK's headers under
      # warnings-as-errors (C4668: NTDDI_WIN10_GE undefined in shellapi.h), and
      # UBT auto-picks the newest SDK installed. Install and pin the era-
      # appropriate SDK for those versions; the VS2019 step above already
      # installs 19041 for UE4, so only 5.0 needs the standalone install
      - name: Install Windows SDK 19041 (UE 5.0 only)
        if: steps.gate.outputs.proceed == 'true' && matrix.version == '5.0'
        run: choco install windows-sdk-10-version-2004-all --no-progress -y

      - name: Disable debug info via BuildConfiguration.xml
        if: steps.gate.outputs.proceed == 'true'
        run: |
          $bcDir = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'Unreal Engine\UnrealBuildTool'
          New-Item -ItemType Directory -Force $bcDir | Out-Null
          $pinSdk = if (("${{ matrix.major }}" -eq "4") -or ("${{ matrix.version }}" -eq "5.0")) {
            "    <WindowsPlatform>`n      <WindowsSdkVersion>10.0.19041.0</WindowsSdkVersion>`n    </WindowsPlatform>`n"
          } else { "" }
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <Configuration xmlns="https://www.unrealengine.com/BuildConfiguration">
            <BuildConfiguration>
              <bDisableDebugInfo>true</bDisableDebugInfo>
            </BuildConfiguration>
          $pinSdk</Configuration>
          "@ | Out-File -Encoding utf8 (Join-Path $bcDir 'BuildConfiguration.xml')
          Get-Content (Join-Path $bcDir 'BuildConfiguration.xml')

      - name: Build plugin against engine source (budgeted)
        if: steps.gate.outputs.proceed == 'true'
        id: build
        run: |
          $elapsedMinutes = ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [int64]$env:JOB_START) / 60
          $budgetMinutes = [math]::Max(10, [int]$env:BUILD_DEADLINE_MINUTES - $elapsedMinutes)
          Write-Host "Build budget: $([int]$budgetMinutes) minutes (attempt $env:ATTEMPT of $env:MAX_ATTEMPTS)"

          $compiler = if (${{ matrix.major }} -eq 4) { @("--compiler", "VS2019") } else { @() }
          $proc = Start-Process python -ArgumentList (@("package.py", "$env:UE_SRC", "$env:RUNNER_TEMP") + $compiler) -PassThru -NoNewWindow
          if ($proc.WaitForExit([int]($budgetMinutes * 60 * 1000))) {
            if ($proc.ExitCode -eq 0) {
              "outcome=success" | Out-File -Append $env:GITHUB_OUTPUT
              Write-Host "Plugin build succeeded"
            } else {
              "outcome=failed" | Out-File -Append $env:GITHUB_OUTPUT
              Write-Host "::error::Plugin build failed with exit code $($proc.ExitCode) (not a timeout). A checkpoint will still be uploaded so a fix can resume from here."
            }
          } else {
            Write-Host "Budget exhausted, stopping the build for checkpointing"
            taskkill /T /F /PID $proc.Id
            "outcome=timeout" | Out-File -Append $env:GITHUB_OUTPUT
          }
          exit 0

      # AutomationTool sometimes dies "before a log file was set" (5.6 does
      # this), leaving the real reason only in its ErrorLog on the runner disk
      - name: Dump AutomationTool logs on failure
        if: steps.gate.outputs.proceed == 'true' && steps.build.outputs.outcome == 'failed'
        run: |
          foreach ($log in @(
            (Join-Path $env:UE_SRC "Engine\Programs\AutomationTool\Saved\Logs\ErrorLog.txt"),
            (Join-Path $env:UE_SRC "Engine\Programs\AutomationTool\Saved\Logs\Log.txt")
          )) {
            if (Test-Path $log) {
              Write-Host "===== $log ====="
              Get-Content $log -Tail 200
            }
          }
          exit 0

      - name: Publish finished engine cache
        id: publish
        if: steps.gate.outputs.proceed == 'true' && steps.build.outputs.outcome == 'success'
        working-directory: ${{ env.UE_SRC }}
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_CACHE_KEY: ${{ secrets.ENGINE_CACHE_KEY }}
        run: |
          $version = Get-Content Engine\Build\Build.version | ConvertFrom-Json
          $tag = "ue-cache/$($version.MajorVersion).$($version.MinorVersion)"

          # Another run may have published this version while we were building;
          # don't interleave uploads with it
          $alreadyComplete = gh release view $tag --repo "${{ github.repository }}" --json assets --jq '[.assets[].name] | contains(["manifest.json"])' 2>$null
          if ("$alreadyComplete" -eq "true") {
            Write-Host "$tag was already published by another run, skipping publish"
            exit 0
          }

          $out = "D:\ue-out"
          New-Item -ItemType Directory -Force $out | Out-Null
          # The uprojectdirs file is named differently across engine eras
          # (UE4Games.uprojectdirs vs Default.uprojectdirs); 7z treats a
          # hardcoded missing name as a fatal scan error
          $uprojectdirs = @((Get-ChildItem *.uprojectdirs -ErrorAction SilentlyContinue).Name)
          7z a -t7z -mx=3 -mhe=on -v1900m "-p$env:ENGINE_CACHE_KEY" "$out\UE-$($version.MajorVersion).$($version.MinorVersion)-min.7z" Engine @uprojectdirs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $volumes = Get-ChildItem "$out\*.7z.*" | Sort-Object Name
          $manifest = @{
            engine_version = "$($version.MajorVersion).$($version.MinorVersion)"
            source_ref = $env:UE_REF
            volumes = @($volumes | ForEach-Object {
              @{ name = $_.Name; bytes = $_.Length; sha256 = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower() }
            })
          }
          $manifest | ConvertTo-Json -Depth 4 | Out-File -Encoding utf8 "$out\manifest.json"

          gh release view $tag --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "${{ github.repository }}" --prerelease `
              --title "Engine cache $($version.MajorVersion).$($version.MinorVersion)" `
              --notes "AES-256 encrypted minimal Unreal Engine build (from source ref $env:UE_REF) for CI plugin builds. Usable only by holders of the repository's ENGINE_CACHE_KEY secret, who must have agreed to Epic's EULA. See Tools/CI/README.md."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            # Stale assets from an older or partial publish must not mix with ours
            $existing = gh release view $tag --repo "${{ github.repository }}" --json assets --jq '.assets[].name'
            foreach ($asset in @($existing | Where-Object { $_ })) { gh release delete-asset $tag $asset --repo "${{ github.repository }}" --yes }
          }
          gh release upload $tag --repo "${{ github.repository }}" --clobber @($volumes.FullName) "$out\manifest.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # The work-in-progress checkpoint is no longer needed
          gh release delete $env:WIP_TAG --repo "${{ github.repository }}" --cleanup-tag --yes 2>$null
          exit 0

      # Runs on build failure/timeout, and also when the build succeeded but
      # only the publish step failed -- otherwise a packaging hiccup forfeits
      # the entire multi-hour compile
      - name: Upload checkpoint
        if: >-
          !cancelled() && steps.gate.outputs.proceed == 'true' &&
          (steps.build.outputs.outcome != 'success' || steps.publish.conclusion == 'failure')
        working-directory: ${{ env.UE_SRC }}
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_CACHE_KEY: ${{ secrets.ENGINE_CACHE_KEY }}
        run: |
          $out = "D:\ue-wip-out"
          New-Item -ItemType Directory -Force $out | Out-Null
          # Fast compression: this is transient state, upload time matters more than size
          $uprojectdirs = @((Get-ChildItem *.uprojectdirs -ErrorAction SilentlyContinue).Name)
          7z a -t7z -mx=1 -mhe=on -v1900m "-p$env:ENGINE_CACHE_KEY" "$out\checkpoint.7z" Engine @uprojectdirs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          gh release view $env:WIP_TAG --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:WIP_TAG --repo "${{ github.repository }}" --prerelease `
              --title "WIP engine cache ($env:UE_REF)" `
              --notes "Encrypted intermediate build state for resumable engine cache builds. Deleted automatically when the build completes."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # Replace the previous checkpoint's volumes entirely in case this one has fewer
          $existing = gh release view $env:WIP_TAG --repo "${{ github.repository }}" --json assets --jq '.assets[].name'
          foreach ($asset in @($existing | Where-Object { $_ })) { gh release delete-asset $env:WIP_TAG $asset --repo "${{ github.repository }}" --yes }
          gh release upload $env:WIP_TAG --repo "${{ github.repository }}" @((Get-ChildItem "$out\*.7z.*").FullName)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Persist the attempt counter for push-triggered resumes (no inputs there)
          $next = [int]$env:ATTEMPT + 1
          gh release edit $env:WIP_TAG --repo "${{ github.repository }}" `
            --notes "Encrypted intermediate build state for resumable engine cache builds. Deleted automatically when the build completes.`n`nnext_attempt=$next"
          exit 0

      - name: Resume via re-dispatch
        if: steps.gate.outputs.proceed == 'true' && steps.build.outputs.outcome == 'timeout'
        env:
          # The default GITHUB_TOKEN can't trigger new workflow runs; the PAT can
          GH_TOKEN: ${{ secrets.UE_SOURCE_TOKEN }}
        run: |
          $next = [int]$env:ATTEMPT + 1
          if ($next -gt [int]$env:MAX_ATTEMPTS) {
            Write-Host "::error::Build did not finish within $env:MAX_ATTEMPTS attempts. The checkpoint is preserved at $env:WIP_TAG; re-dispatch manually with a higher attempt/max_attempts to continue."
            exit 1
          }
          Write-Host "Re-dispatching attempt $next of $env:MAX_ATTEMPTS"
          gh workflow run engine-cache.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" `
            -f ue_ref="$env:UE_REF" -f attempt="$next" -f max_attempts="$env:MAX_ATTEMPTS"
          if ($LASTEXITCODE -eq 0) { exit 0 }

          # workflow_dispatch 404s until this file lands on the default branch.
          # Fall back to an empty commit pushed with the PAT (pushes made with
          # the built-in GITHUB_TOKEN would not trigger workflows), which fires
          # this workflow's push trigger; automatic mode then resumes every
          # version that still has a checkpoint. Retries handle races between
          # matrix jobs pushing at the same time
          Write-Host "workflow_dispatch unavailable, falling back to an empty commit on ${{ github.ref_name }}"
          git config user.email "noreply@anthropic.com"
          git config user.name "engine-cache resume"
          git commit --allow-empty -m "Resume engine cache build ($env:UE_REF, attempt $next)"
          foreach ($try in 1..5) {
            git pull --rebase "https://x-access-token:$($env:GH_TOKEN)@github.com/${{ github.repository }}.git" "${{ github.ref_name }}"
            git push "https://x-access-token:$($env:GH_TOKEN)@github.com/${{ github.repository }}.git" HEAD:"${{ github.ref_name }}"
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds (10 * $try)
          }
          exit 1

      - name: Fail job if the build failed outright
        if: steps.gate.outputs.proceed == 'true' && steps.build.outputs.outcome == 'failed'
        run: exit 1

  # Bonus: UE on Apple Silicon, as a Darwin canary rather than a full matrix.
  # Same checkpoint/resume scheme, publishing to ue-cache-mac/<version>, which
  # UnrealLibretro.yml's discover-mac-engines/build-mac jobs consume the same
  # way the Windows side consumes ue-cache/<version>
  build-engine-mac:
    needs: prepare
    if: needs.prepare.outputs.mac_ref != ''
    runs-on: macos-latest
    timeout-minutes: 350
    permissions:
      contents: write
    concurrency:
      group: engine-cache-mac-${{ needs.prepare.outputs.mac_ref }}
      cancel-in-progress: false
    env:
      UE_SRC: ${{ github.workspace }}/../UE-src
      UE_REF: ${{ needs.prepare.outputs.mac_ref }}
      ATTEMPT: ${{ inputs.attempt || '1' }}
      MAX_ATTEMPTS: ${{ inputs.max_attempts || '6' }}
      BUILD_DEADLINE_MINUTES: "280"
      # See the Windows job: post-release NuGet advisories break UAT's script
      # build, and mixed obj/uatobj intermediates duplicate generated protos
      NuGetAudit: "false"
      DefaultItemExcludes: "obj/**;bin/**;uatobj/**"

    steps:
      - uses: actions/checkout@v4

      # See the equivalent step in build-engine: a version already finished
      # and published by an older run can sit fully built while this job waits
      # behind the concurrency lock, so check before redoing 4+ hours of work.
      # The major.minor isn't known for certain until after cloning (it comes
      # from Engine/Build/Build.version), but Epic's -release tags consistently
      # follow X.Y.Z-release, so parse it from the ref instead of cloning first
      - name: Skip if this version was already published while queued
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(echo "${UE_REF%%-*}" | cut -d. -f1,2)
          tag="ue-cache-mac/$version"
          alreadyComplete=$(gh release view "$tag" --repo "${{ github.repository }}" --json assets --jq '[.assets[].name] | contains(["manifest.json"])' 2>/dev/null || echo false)
          if [ "$alreadyComplete" = "true" ]; then
            echo "$tag was already published (likely by a run that finished while this job was queued behind the concurrency lock). Skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check required secrets
        if: steps.gate.outputs.proceed == 'true'
        env:
          UE_SOURCE_TOKEN: ${{ secrets.UE_SOURCE_TOKEN }}
          ENGINE_CACHE_KEY: ${{ secrets.ENGINE_CACHE_KEY }}
        run: |
          if [ -z "$UE_SOURCE_TOKEN" ]; then echo "::error::Missing UE_SOURCE_TOKEN secret"; exit 1; fi
          if [ -z "$ENGINE_CACHE_KEY" ]; then echo "::error::Missing ENGINE_CACHE_KEY secret"; exit 1; fi
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          echo "WIP_TAG=ue-cache-wip/mac-$(echo "$UE_REF" | tr '/\\' '--')" >> "$GITHUB_ENV"
          df -h

      - name: Install 7-Zip
        if: steps.gate.outputs.proceed == 'true'
        run: brew install p7zip

      # The engine deps download alone is ~26GB and free space on the image
      # varies run to run (one run died at 70% of the download). The unused
      # Xcode installs are the big win at ~15-20GB apiece
      - name: Reclaim disk space
        if: steps.gate.outputs.proceed == 'true'
        run: |
          df -h /
          active=$(xcode-select -p | sed 's|/Contents/Developer||')
          for xcode in /Applications/Xcode*.app; do
            if [ "$xcode" != "$active" ]; then sudo rm -rf "$xcode" & fi
          done
          sudo rm -rf /Library/Developer/CoreSimulator/Volumes ~/Library/Android \
            /Users/runner/hostedtoolcache/CodeQL 2>/dev/null || true
          wait
          df -h /

      - name: Restore checkpoint if one exists
        if: steps.gate.outputs.proceed == 'true'
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_CACHE_KEY: ${{ secrets.ENGINE_CACHE_KEY }}
        run: |
          if gh release download "$WIP_TAG" --repo "${{ github.repository }}" --dir "$HOME/ue-wip" 2>/dev/null; then
            body=$(gh release view "$WIP_TAG" --repo "${{ github.repository }}" --json body --jq .body)
            if [[ "$body" =~ next_attempt=([0-9]+) ]]; then
              effective=$(( BASH_REMATCH[1] > ATTEMPT ? BASH_REMATCH[1] : ATTEMPT ))
              echo "ATTEMPT=$effective" >> "$GITHUB_ENV"
              export ATTEMPT=$effective
            fi
            echo "Resuming from checkpoint $WIP_TAG (attempt $ATTEMPT)"
            7z x -aoa -p"$ENGINE_CACHE_KEY" -o"$UE_SRC" "$HOME"/ue-wip/*.7z.001
            rm -rf "$HOME/ue-wip"
            # Early checkpoints were made from trees whose IOS/TVOS automation
            # projects had been deleted, which UAT hard-fails on. Discard them
            if [ ! -d "$UE_SRC/Engine/Source/Programs/AutomationTool/IOS" ]; then
              echo "Checkpoint predates the IOS/TVOS automation fix, discarding it and starting fresh"
              rm -rf "$UE_SRC"
              gh release delete "$WIP_TAG" --repo "${{ github.repository }}" --cleanup-tag --yes 2>/dev/null || true
              echo "resumed=false" >> "$GITHUB_OUTPUT"
            else
              # Stale C# obj/bin from a previous attempt corrupt protobuf
              # codegen under a different dotnet SDK; they rebuild in seconds
              find "$UE_SRC/Engine/Source/Programs" -type d \( -name obj -o -name bin -o -name uatobj \) -prune -exec rm -rf {} + 2>/dev/null || true
              echo "resumed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No checkpoint at $WIP_TAG, starting fresh"
            echo "resumed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone Unreal Engine source
        if: steps.gate.outputs.proceed == 'true' && steps.restore.outputs.resumed == 'false'
        env:
          UE_SOURCE_TOKEN: ${{ secrets.UE_SOURCE_TOKEN }}
          GH_TOKEN: ${{ secrets.UE_SOURCE_TOKEN }}
        run: |
          git clone --depth 1 --branch "$UE_REF" \
            "https://x-access-token:${UE_SOURCE_TOKEN}@github.com/EpicGames/UnrealEngine.git" "$UE_SRC"
          cd "$UE_SRC"
          rm -rf .git Samples Templates FeaturePacks Engine/Documentation Engine/Extras
          # Apply Epic's corrected Commit.gitdeps.xml if the tag's release has one
          gh release download "$UE_REF" --repo EpicGames/UnrealEngine --pattern "Commit.gitdeps.xml" \
            --dir "$UE_SRC/Engine/Build" --clobber \
            && echo "Applied updated Commit.gitdeps.xml from the $UE_REF release" \
            || echo "No updated Commit.gitdeps.xml published for $UE_REF"

      - name: Download engine dependencies (GitDependencies)
        if: steps.gate.outputs.proceed == 'true' && steps.restore.outputs.resumed == 'false'
        working-directory: ${{ env.UE_SRC }}
        run: |
          gitdeps=""
          for candidate in Engine/Binaries/DotNET/GitDependencies/osx-arm64/GitDependencies \
                           Engine/Binaries/DotNET/GitDependencies/osx-x64/GitDependencies; do
            if [ -f "$candidate" ]; then gitdeps="$candidate"; break; fi
          done
          if [ -z "$gitdeps" ]; then echo "::error::GitDependencies not found in the engine tree"; exit 1; fi
          chmod +x "$gitdeps"
          # Windows payloads stay excluded too -- this cache only ever builds
          # Mac. IOS/TVOS payloads stay INCLUDED because RunUAT compiles their
          # automation projects, which need resources from the dependency stream
          "./$gitdeps" --exclude=Android --exclude=Linux --exclude=Linux32 --exclude=LinuxArm64 \
            --exclude=HoloLens --exclude=HTML5 \
            --exclude=Win32 --exclude=Win64 --force
          rm -rf Engine/Content Engine/Documentation Engine/Extras Samples Templates FeaturePacks
          df -h

      # The arm64 runners have 3 cores but only ~7GB RAM; three concurrent
      # editor-sized unity files swap-thrash hard enough that GitHub loses
      # contact and kills the runner outright, which bypasses checkpointing
      # entirely (it happened on Module.Sequencer.*). Make UBT budget memory
      # per compile action so it schedules fewer of the giant ones at once
      - name: Cap UnrealBuildTool memory use via BuildConfiguration.xml
        if: steps.gate.outputs.proceed == 'true'
        run: |
          bcDir="$HOME/Documents/Unreal Engine/UnrealBuildTool"
          mkdir -p "$bcDir"
          cat > "$bcDir/BuildConfiguration.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <Configuration xmlns="https://www.unrealengine.com/BuildConfiguration">
            <BuildConfiguration>
              <bDisableDebugInfo>true</bDisableDebugInfo>
            </BuildConfiguration>
            <ParallelExecutor>
              <MemoryPerActionBytes>3221225472</MemoryPerActionBytes>
            </ParallelExecutor>
          </Configuration>
          XML

      - name: Build plugin against engine source (budgeted)
        if: steps.gate.outputs.proceed == 'true'
        id: build
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          budget=$(( BUILD_DEADLINE_MINUTES * 60 - elapsed ))
          [ "$budget" -lt 600 ] && budget=600
          echo "Build budget: $(( budget / 60 )) minutes (attempt $ATTEMPT of $MAX_ATTEMPTS)"

          python3 package.py "$UE_SRC" "$RUNNER_TEMP" &
          pid=$!
          deadline=$(( $(date +%s) + budget ))
          outcome=""
          while kill -0 $pid 2>/dev/null; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Budget exhausted, stopping the build for checkpointing"
              kill -TERM $pid 2>/dev/null || true
              pkill -TERM -f "RunUAT|UnrealBuildTool|clang" 2>/dev/null || true
              sleep 10
              kill -KILL $pid 2>/dev/null || true
              outcome="timeout"
              break
            fi
            sleep 20
          done
          if [ -z "$outcome" ]; then
            if wait $pid; then
              outcome="success"
              echo "Plugin build succeeded"
            else
              outcome="failed"
              echo "::error::Plugin build failed (not a timeout). A checkpoint will still be uploaded so a fix can resume from here."
            fi
          fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

      - name: Upload packaged Mac plugin
        if: steps.gate.outputs.proceed == 'true' && steps.build.outputs.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: UnrealLibretro-Mac-${{ env.UE_REF }}
          path: ${{ runner.temp }}/UnrealLibretro-*/
          if-no-files-found: error

      - name: Publish finished engine cache
        id: publish
        if: steps.gate.outputs.proceed == 'true' && steps.build.outputs.outcome == 'success'
        working-directory: ${{ env.UE_SRC }}
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_CACHE_KEY: ${{ secrets.ENGINE_CACHE_KEY }}
        run: |
          major=$(python3 -c "import json;print(json.load(open('Engine/Build/Build.version'))['MajorVersion'])")
          minor=$(python3 -c "import json;print(json.load(open('Engine/Build/Build.version'))['MinorVersion'])")
          tag="ue-cache-mac/$major.$minor"

          # Another run may have published this version while we were building
          alreadyComplete=$(gh release view "$tag" --repo "${{ github.repository }}" --json assets --jq '[.assets[].name] | contains(["manifest.json"])' 2>/dev/null || echo false)
          if [ "$alreadyComplete" = "true" ]; then
            echo "$tag was already published by another run, skipping publish"
            exit 0
          fi

          # Stray clang/UBT workers from the build can still be mutating
          # Engine/Saved while 7z scans it, which is a fatal stat error; kill
          # them and leave that volatile dir out of the archive entirely
          pkill -TERM -f "RunUAT|UnrealBuildTool|clang" 2>/dev/null || true
          sleep 5
          pkill -KILL -f "RunUAT|UnrealBuildTool|clang" 2>/dev/null || true

          out="$HOME/ue-out"
          mkdir -p "$out"
          7z a -t7z -mx=3 -mhe=on -v1900m -p"$ENGINE_CACHE_KEY" '-x!Engine/Saved' "$out/UE-$major.$minor-mac-min.7z" Engine Default.uprojectdirs

          (cd "$out" && for v in *.7z.*; do
            printf '{"name":"%s","bytes":%s,"sha256":"%s"}\n' \
              "$v" "$(stat -f%z "$v")" "$(shasum -a 256 "$v" | cut -d' ' -f1)"
          done) | jq -s --arg ver "$major.$minor" --arg ref "$UE_REF" \
            '{engine_version: $ver, source_ref: $ref, platform: "Mac", volumes: .}' > "$out/manifest.json"

          if ! gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$tag" --repo "${{ github.repository }}" --prerelease \
              --title "Engine cache $major.$minor (Mac arm64)" \
              --notes "AES-256 encrypted minimal Unreal Engine build (from source ref $UE_REF, Apple Silicon) for CI plugin builds. Usable only by holders of the repository's ENGINE_CACHE_KEY secret, who must have agreed to Epic's EULA. See Tools/CI/README.md."
          else
            for asset in $(gh release view "$tag" --repo "${{ github.repository }}" --json assets --jq '.assets[].name'); do
              gh release delete-asset "$tag" "$asset" --repo "${{ github.repository }}" --yes
            done
          fi
          gh release upload "$tag" --repo "${{ github.repository }}" --clobber "$out"/*.7z.* "$out/manifest.json"
          gh release delete "$WIP_TAG" --repo "${{ github.repository }}" --cleanup-tag --yes 2>/dev/null || true

      # Also fires when only the publish failed, so a packaging hiccup doesn't
      # forfeit the multi-hour compile (see the Windows twin of this step)
      - name: Upload checkpoint
        if: >-
          !cancelled() && steps.gate.outputs.proceed == 'true' &&
          (steps.build.outputs.outcome != 'success' || steps.publish.conclusion == 'failure')
        working-directory: ${{ env.UE_SRC }}
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_CACHE_KEY: ${{ secrets.ENGINE_CACHE_KEY }}
        run: |
          # Same stray-writer hazard as the publish step: make sure nothing is
          # still mutating the tree while 7z scans it
          pkill -KILL -f "RunUAT|UnrealBuildTool|clang" 2>/dev/null || true
          sleep 5

          out="$HOME/ue-wip-out"
          mkdir -p "$out"
          7z a -t7z -mx=1 -mhe=on -v1900m -p"$ENGINE_CACHE_KEY" "$out/checkpoint.7z" Engine Default.uprojectdirs
          if ! gh release view "$WIP_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$WIP_TAG" --repo "${{ github.repository }}" --prerelease \
              --title "WIP engine cache (mac $UE_REF)" \
              --notes "Encrypted intermediate build state for resumable engine cache builds. Deleted automatically when the build completes."
          fi
          for asset in $(gh release view "$WIP_TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name'); do
            gh release delete-asset "$WIP_TAG" "$asset" --repo "${{ github.repository }}" --yes
          done
          gh release upload "$WIP_TAG" --repo "${{ github.repository }}" "$out"/*.7z.*
          next=$(( ATTEMPT + 1 ))
          gh release edit "$WIP_TAG" --repo "${{ github.repository }}" \
            --notes "$(printf 'Encrypted intermediate build state for resumable engine cache builds. Deleted automatically when the build completes.\n\nnext_attempt=%s' "$next")"

      - name: Resume via re-dispatch
        if: steps.gate.outputs.proceed == 'true' && steps.build.outputs.outcome == 'timeout'
        env:
          GH_TOKEN: ${{ secrets.UE_SOURCE_TOKEN }}
        run: |
          next=$(( ATTEMPT + 1 ))
          if [ "$next" -gt "$MAX_ATTEMPTS" ]; then
            echo "::error::Build did not finish within $MAX_ATTEMPTS attempts. The checkpoint is preserved at $WIP_TAG."
            exit 1
          fi
          echo "Re-dispatching attempt $next of $MAX_ATTEMPTS"
          if gh workflow run engine-cache.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" \
            -f mac_ref="$UE_REF" -f attempt="$next" -f max_attempts="$MAX_ATTEMPTS"; then
            exit 0
          fi
          echo "workflow_dispatch unavailable, falling back to an empty commit on ${{ github.ref_name }}"
          git config user.email "noreply@anthropic.com"
          git config user.name "engine-cache resume"
          git commit --allow-empty -m "Resume engine cache build (mac $UE_REF, attempt $next)"
          for try in 1 2 3 4 5; do
            git pull --rebase "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "${{ github.ref_name }}" || true
            if git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:"${{ github.ref_name }}"; then
              exit 0
            fi
            sleep $(( 10 * try ))
          done
          exit 1

      - name: Fail job if the build failed outright
        if: steps.gate.outputs.proceed == 'true' && steps.build.outputs.outcome == 'failed'
        run: exit 1
